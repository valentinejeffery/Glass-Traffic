name: Build PacketAtlas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows (x86_64 MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test
      - name: Build release binary
        run: cargo build --release
      - name: Build NSIS Windows Installer
        shell: pwsh
        run: |
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $makensis) {
            choco install nsis -y
            $env:Path += ";C:\Program Files (x86)\NSIS"
          }
          makensis "/DAPP_VERSION=0.2.0" "/DBINARY_PATH=..\target\release\packetatlas.exe" "/DOUT_FILE=..\PacketAtlas-Setup-0.2.0.exe" installer\packetatlas.nsi
      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketAtlas-Setup-0.2.0-windows-x86_64
          path: PacketAtlas-Setup-0.2.0.exe
      - name: Upload standalone packetatlas.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: packetatlas-windows-x86_64
          path: target/release/packetatlas.exe
